version: 2.1

# Build and test on every push; on a v* tag, also sign, notarize and publish the release.
# The release job reads these environment variables from the CircleCI context `syncophant-release`:
#   DEVELOPER_ID_P12, DEVELOPER_ID_P12_PASSWORD   base64 Developer ID Application certificate and its password
#   APP_PROVISIONING_PROFILE, PROVIDER_PROVISIONING_PROFILE   base64 provisioning profiles
#   APPLE_ID, APPLE_APP_PASSWORD   notarization account and app-specific password
#   SPARKLE_PRIVATE_KEY            EdDSA key that signs the appcast
#   GH_TOKEN                       token with contents:write on syncophant-app/macos
#   HOMEBREW_TAP_DEPLOY_KEY        deploy key with write access to syncophant-app/homebrew-tap

parameters:
  xcode:
    type: string
    default: "26.6"

executors:
  mac:
    macos:
      xcode: << pipeline.parameters.xcode >>
    resource_class: m4pro.medium
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # Keep brew installs from upgrading unrelated tools preinstalled on the CI image.
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

commands:
  setup:
    description: Tools, the pinned SSH library and the encryption helper, with caches.
    steps:
      - checkout
      - run:
          name: Install build tools
          command: |
            brew install cmake pkg-config go
            gem install xcodeproj --no-document
      - restore_cache:
          keys:
            - deps-v1-{{ arch }}-{{ checksum "scripts/bootstrap.sh" }}
      - run:
          name: Bootstrap pinned SSH library
          command: bash scripts/bootstrap.sh
      - save_cache:
          key: deps-v1-{{ arch }}-{{ checksum "scripts/bootstrap.sh" }}
          paths: [.deps]
      - restore_cache:
          keys:
            - go-v1-{{ arch }}-{{ checksum "scripts/crypt-helper/go.sum" }}
      - run:
          name: Build pinned encryption helper
          command: bash scripts/build-crypt-helper.sh
      - save_cache:
          key: go-v1-{{ arch }}-{{ checksum "scripts/crypt-helper/go.sum" }}
          paths: [~/go/pkg/mod, ~/Library/Caches/go-build]
      - restore_cache:
          keys:
            - spm-v1-{{ arch }}-{{ checksum "Package.resolved" }}

jobs:
  test:
    executor: mac
    steps:
      - setup
      - run:
          name: Test
          command: |
            mkdir -p build/test-results
            bash scripts/test.sh --xunit-output build/test-results/swift.xml
      - save_cache:
          key: spm-v1-{{ arch }}-{{ checksum "Package.resolved" }}
          paths: [.build/checkouts, .build/repositories, .build/artifacts]
      - store_test_results:
          path: build/test-results
      - run:
          name: Build app and File Provider
          command: bash scripts/build.sh
      - run:
          name: Archive unsigned app
          command: ditto -c -k --keepParent build/DerivedData/Build/Products/Debug/Syncophant.app build/Syncophant-unsigned.zip
      - store_artifacts:
          path: build/Syncophant-unsigned.zip
          destination: Syncophant-unsigned.zip

  release:
    executor: mac
    environment:
      SYNCOPHANT_TEAM_ID: 654ASRW868
      SYNCOPHANT_DISTRIBUTION: 1
      SYNCOPHANT_NOTARY_PROFILE: syncophant-notary
    steps:
      - setup
      - run:
          name: Install signing certificate, profiles and notary credentials
          command: |
            for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD APP_PROVISIONING_PROFILE PROVIDER_PROVISIONING_PROFILE APPLE_ID APPLE_APP_PASSWORD; do
              [[ -n "${!name:-}" ]] || { echo "Missing $name in the syncophant-release context." >&2; exit 1; }
            done
            work=$(mktemp -d)
            keychain="$work/signing.keychain-db"
            password=$(uuidgen)
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            echo "$DEVELOPER_ID_P12" | base64 --decode > "$work/developer-id.p12"
            security import "$work/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm "$work/developer-id.p12"
            security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            security default-keychain -s "$keychain"
            profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            mkdir -p "$profiles"
            echo "$APP_PROVISIONING_PROFILE" | base64 --decode > "$profiles/app.provisionprofile"
            echo "$PROVIDER_PROVISIONING_PROFILE" | base64 --decode > "$profiles/provider.provisionprofile"
            xcrun notarytool store-credentials "$SYNCOPHANT_NOTARY_PROFILE" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$SYNCOPHANT_TEAM_ID"
      - run:
          name: Build, sign and notarize
          command: SYNCOPHANT_VERSION="${CIRCLE_TAG#v}" SYNCOPHANT_BUILD="$CIRCLE_BUILD_NUM" bash scripts/package.sh
      - run:
          name: Sign the Sparkle appcast
          command: |
            # The app reads releases/latest/download/appcast.xml, so each release only needs its own entry.
            [[ -n "${SPARKLE_PRIVATE_KEY:-}" ]] || { echo 'Missing SPARKLE_PRIVATE_KEY in the syncophant-release context.' >&2; exit 1; }
            swift package resolve
            feed=$(mktemp -d)
            cp build/Syncophant-*.zip "$feed/"
            echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - \
              --download-url-prefix "https://github.com/syncophant-app/macos/releases/download/$CIRCLE_TAG/" \
              --link https://syncophant.app "$feed"
            cp "$feed/appcast.xml" build/appcast.xml
      - run:
          name: Attach to GitHub release
          command: |
            [[ -n "${GH_TOKEN:-}" ]] || { echo 'Missing GH_TOKEN in the syncophant-release context.' >&2; exit 1; }
            command -v gh > /dev/null || brew install gh
            # Stable name so the website can link to releases/latest/download/Syncophant.dmg.
            cp build/Syncophant-*.dmg build/Syncophant.dmg
            gh release view "$CIRCLE_TAG" --repo syncophant-app/macos > /dev/null 2>&1 ||
              gh release create "$CIRCLE_TAG" --repo syncophant-app/macos --verify-tag --title "$CIRCLE_TAG" --generate-notes
            gh release upload "$CIRCLE_TAG" --repo syncophant-app/macos --clobber \
              build/Syncophant.dmg build/Syncophant-*.zip build/appcast.xml build/*.sha256 build/*.tar.gz
      - run:
          name: Bump Homebrew cask
          command: |
            # Pre-release tags such as v1.2.0-beta.1 do not update the cask.
            [[ "$CIRCLE_TAG" != *-* ]] || { echo "Pre-release $CIRCLE_TAG: cask unchanged."; exit 0; }
            [[ -n "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]] || { echo 'Missing HOMEBREW_TAP_DEPLOY_KEY in the syncophant-release context.' >&2; exit 1; }
            version="${CIRCLE_TAG#v}"
            sha256=$(shasum -a 256 "build/Syncophant-$version-arm64.zip" | cut -d ' ' -f 1)
            work=$(mktemp -d)
            printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$work/tap_deploy_key"
            chmod 600 "$work/tap_deploy_key"
            export GIT_SSH_COMMAND="ssh -i $work/tap_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git clone --depth 1 git@github.com:syncophant-app/homebrew-tap.git "$work/homebrew-tap"
            cd "$work/homebrew-tap"
            sed -i '' -E \
              -e "s/^  version \".*\"/  version \"$version\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"$sha256\"/" \
              Casks/syncophant.rb
            git diff --quiet && { echo "Cask already at $version."; exit 0; }
            git -c user.name='Syncophant Release' -c user.email='release@syncophant.app' commit -am "syncophant $version"
            git push

workflows:
  build-and-test:
    jobs:
      - test:
          filters:
            tags:
              only: /^v.*/
      - release:
          context: syncophant-release
          requires: [test]
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
