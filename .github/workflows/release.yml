name: Release
# Pushing a v* tag (or publishing a release with a new tag in the GitHub UI)
# builds, signs and notarizes the app, then attaches it to that tag's release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
jobs:
  release:
    runs-on: macos-26
    env:
      SYNCOPHANT_TEAM_ID: 654ASRW868
      SYNCOPHANT_DISTRIBUTION: 1
      SYNCOPHANT_NOTARY_PROFILE: syncophant-notary
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: scripts/crypt-helper/go.mod
      - name: Install build tools
        run: |
          brew install cmake pkg-config ruby
          gem install xcodeproj --no-document
      - name: Install signing certificate, profiles and notary credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_PROFILE: ${{ secrets.APP_PROVISIONING_PROFILE }}
          PROVIDER_PROFILE: ${{ secrets.PROVIDER_PROVISIONING_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          echo "$APP_PROFILE" | base64 --decode > "$profiles/app.provisionprofile"
          echo "$PROVIDER_PROFILE" | base64 --decode > "$profiles/provider.provisionprofile"
          xcrun notarytool store-credentials "$SYNCOPHANT_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$SYNCOPHANT_TEAM_ID"
      - name: Build, sign and notarize
        run: SYNCOPHANT_VERSION="${GITHUB_REF_NAME#v}" SYNCOPHANT_BUILD="$GITHUB_RUN_NUMBER" bash scripts/package.sh
      - name: Sign the Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # The app reads releases/latest/download/appcast.xml, so each release only needs its own entry.
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo 'Missing SPARKLE_PRIVATE_KEY secret.' >&2; exit 1; }
          swift package resolve
          feed="$RUNNER_TEMP/appcast"
          mkdir -p "$feed"
          cp build/Syncophant-*.zip "$feed/"
          echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/" \
            --link https://syncophant.app "$feed"
          cp "$feed/appcast.xml" build/appcast.xml
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable name so the website can link to releases/latest/download/Syncophant.dmg.
          cp build/Syncophant-*.dmg build/Syncophant.dmg
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber \
            build/Syncophant.dmg build/Syncophant-*.zip build/appcast.xml build/*.sha256 build/*.tar.gz
      - name: Bump Homebrew cask
        # Pre-release tags such as v1.2.0-beta.1 do not update the cask.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256=$(shasum -a 256 "build/Syncophant-$version-arm64.zip" | cut -d ' ' -f 1)
          key="$RUNNER_TEMP/tap_deploy_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:syncophant-app/homebrew-tap.git "$RUNNER_TEMP/homebrew-tap"
          cd "$RUNNER_TEMP/homebrew-tap"
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$sha256\"/" \
            Casks/syncophant.rb
          git diff --quiet && { echo "Cask already at $version."; exit 0; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -am "syncophant $version"
          git push
