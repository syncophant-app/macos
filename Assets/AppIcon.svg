<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#0A5FDB"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="mk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#06307A" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- tile: 824 squircle-ish on 1024 canvas (macOS grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <g filter="url(#mk)">
    <!-- ears: two sync rings, each open with a gap, rotated opposite -->
    <g fill="none" stroke="#fff" stroke-width="54" stroke-linecap="round" opacity=".62">
      <path d="M 370 330 A 150 150 0 1 0 370 610"/>
      <path d="M 654 330 A 150 150 0 1 1 654 610"/>
    </g>
    <!-- head + trunk, one continuous shape -->
    <path fill="url(#fg)" d="M 512 290 C 616 290 676 366 676 466 C 676 540 650 590 628 624
      L 628 700 C 628 748 596 780 556 780 C 522 780 500 758 500 730 C 500 704 520 692 540 692
      C 552 692 556 684 556 672 L 556 640 C 470 650 348 590 348 466 C 348 366 408 290 512 290 Z"/>
    <circle cx="448" cy="456" r="22" fill="#0A5FDB"/>
    <circle cx="576" cy="456" r="22" fill="#0A5FDB"/>
  </g>
</svg>
